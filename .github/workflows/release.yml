name: Build and release Stream Deck plugin

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: streamdeck-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Check out release commit
              uses: actions/checkout@v4

            - name: Resolve release version
              id: release
              shell: bash
              run: |
                  package_version="$(node -p "require('./plugin/package.json').version")"
                  manifest_version="$(node -p "require('./plugin/manifest.json').Version")"

                  if [[ "${manifest_version}" != "${package_version}.0" ]]; then
                    echo "package.json (${package_version}) and manifest.json (${manifest_version}) do not match." >&2
                    exit 1
                  fi

                  version="${package_version}.${GITHUB_RUN_NUMBER}"
                  echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"

            - name: Stamp build version
              shell: bash
              env:
                  RELEASE_VERSION: ${{ steps.release.outputs.version }}
              run: |
                  node -e '
                    const fs = require("fs");
                    const path = "./plugin/manifest.json";
                    const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
                    manifest.Version = process.env.RELEASE_VERSION;
                    fs.writeFileSync(path, JSON.stringify(manifest, null, "\t") + "\n");
                  '

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: plugin/package-lock.json

            - name: Install dependencies
              working-directory: plugin
              run: npm ci

            - name: Run unit tests
              working-directory: plugin
              run: npm test

            - name: Run type check
              working-directory: plugin
              run: npm run check

            - name: Build plugin
              working-directory: plugin
              run: npm run build

            - name: Run runtime smoke test
              working-directory: plugin
              run: npm run test:runtime

            - name: Validate plugin bundle
              working-directory: plugin
              run: npx --yes @elgato/cli@1.7.4 validate ninja.socialstream.streamdeck.sdPlugin --no-update-check

            - name: Package plugin
              working-directory: plugin
              run: npx --yes @elgato/cli@1.7.4 pack ninja.socialstream.streamdeck.sdPlugin --output release --force --no-update-check

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: social-stream-ninja-streamdeck-${{ steps.release.outputs.tag }}
                  path: plugin/release/*.streamDeckPlugin
                  if-no-files-found: error

            - name: Create or update GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                    gh release upload "${RELEASE_TAG}" plugin/release/*.streamDeckPlugin \
                      --repo "${GITHUB_REPOSITORY}" \
                      --clobber
                  else
                    gh release create "${RELEASE_TAG}" plugin/release/*.streamDeckPlugin \
                      --repo "${GITHUB_REPOSITORY}" \
                      --target "${GITHUB_SHA}" \
                      --title "Social Stream Ninja Stream Deck ${RELEASE_TAG}" \
                      --generate-notes \
                      --latest
                  fi
